<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TPulse</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <section class="top">
    <div class="title">
      <h1>Gerencie seus treinos</h1>
      <h3>Faça a gestão de seus treinos e acompanhe a sua evolução de uma forma simples, prática e profissional.</h3>

      <a href="https://docs.google.com/spreadsheets/d/1vmK5VneHtmSQHC-_lb13brIxDgyuy5LouZPEnAwXPdI/edit?usp=sharing" target="_blank">
        <button>Acessar planilha de treino</button>
      </a>
    </div>

    <div class="image">
      <img src="tpulse-img.png" alt="Imagem de treino">
    </div>
  </section>

  <section class="role">
    <h2>Funcionalidades</h2>
    <ul>
      <li><i class="fas fa-weight"></i> Gestão de biopedância</li>
      <li><i class="fas fa-book"></i> Criação de treinos</li>
      <li><i class="fas fa-chart-line"></i> Histórico e evolução</li>
      <li><i class="fas fa-database"></i> Banco de dados de exercícios adaptável</li>
    </ul>
  </section>

  <footer>
    <a href="#">Termos de uso</a>
    <a href="#">Política de privacidade</a>
    <a href="https://github.com/talyttacarvalho" target="_blank">
      <i class="fab fa-github"></i>
    </a>
    <a href="https://www.linkedin.com/in/talytta-carvalho/" target="_blank">
      <i class="fab fa-linkedin"></i>
    </a>
  </footer>

</body>
</html>
