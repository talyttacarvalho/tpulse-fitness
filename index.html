
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TPulse Fitness | Gestão de Treinos</title>

  <meta
    name="description"
    content="Conheça o TPulse Fitness, uma proposta para organizar treinos, acompanhar sua evolução e facilitar sua rotina de exercícios."
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  >
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>
    <section class="top">
      <div class="title">
        <h1>Gerencie seus treinos</h1>

        <h3>
          Faça a gestão de seus treinos e acompanhe a sua evolução
          de uma forma simples, prática e profissional.
        </h3>

        <a
          href="https://docs.google.com/spreadsheets/d/1vmK5VneHtmSQHC-_lb13brIxDgyuy5LouZPEnAwXPdI/edit?usp=sharing"
          target="_blank"
          rel="noopener noreferrer"
          class="training-link"
        >
          Acessar planilha de treino
        </a>
      </div>

      <div class="image">
        <img
          src="tpulse-img.png"
          alt="Ilustração relacionada à prática de exercícios físicos"
        >
      </div>
    </section>

    <section class="role" aria-labelledby="features-title">
      <h2 id="features-title">Funcionalidades</h2>

      <ul>
        <li>
          <i class="fas fa-weight" aria-hidden="true"></i>
          Gestão de bioimpedância
        </li>
        <li>
          <i class="fas fa-book" aria-hidden="true"></i>
          Criação de treinos
        </li>
        <li>
          <i class="fas fa-chart-line" aria-hidden="true"></i>
          Histórico e evolução
        </li>
        <li>
          <i class="fas fa-database" aria-hidden="true"></i>
          Banco de dados de exercícios adaptável
        </li>
      </ul>
    </section>
  </main>

  <footer>
    <a
      href="https://github.com/talyttacarvalho"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="GitHub de Talytta Carvalho"
    >
      <i class="fab fa-github" aria-hidden="true"></i>
    </a>

    <a
      href="https://www.linkedin.com/in/talytta-carvalho/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="LinkedIn de Talytta Carvalho"
    >
      <i class="fab fa-linkedin" aria-hidden="true"></i>
    </a>
  </footer>
</body>

</html>
